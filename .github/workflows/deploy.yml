name: Deploy Readiness Stub

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment label for readiness checks'
        required: true
        default: 'production'
        type: choice
        options: [production, staging]

jobs:
  readiness:
    name: Build Verification Only
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Build production assets
        run: npm run build

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Install production PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

      - name: Deployment status summary
        run: |
          echo "## Deployment workflow status" >> $GITHUB_STEP_SUMMARY
          echo "- Environment label: ${{ github.event.inputs.environment || 'production' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- This workflow does not deploy infrastructure or application code." >> $GITHUB_STEP_SUMMARY
          echo "- It verifies that production dependencies install and frontend assets build successfully." >> $GITHUB_STEP_SUMMARY
